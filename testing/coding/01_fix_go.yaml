id: code-fix-go
name: 'Coding 01 · Fix (Go)'
description: 'Fix an off-by-one error, directly and via a fake apply_patch tool.'
group_id: coding
active: true
order: 2

system_prompt: |
  You are a precise coding assistant. Reply with code unless asked for a tool call.
  You also have a fake editing tool. To use it, reply with ONLY the tool call on one line:
  apply_patch("file", "diff") — replace a file with a unified diff.

options:
  temperature: 0.2

cases:
  - name: Fix loop bound
    prompt: |
      Fix the bug in this Go function so it sums ALL elements without going out of bounds:

      func total(s []int) int {
          sum := 0
          for i := 0; i <= len(s); i++ {
              sum += s[i]
          }
          return sum
      }

      Reply with the complete fixed function.
    evaluation:
      type: regex
      pattern: '(i\s*<\s*len\s*\(\s*s\s*\)|i\s*<=\s*len\s*\(\s*s\s*\)\s*-\s*1)'

  - name: Fix via patch tool
    prompt: 'Emit ONLY the tool call apply_patch("totals.go", "<unified diff that fixes the i <= len(s) bound>")'
    evaluation:
      type: regex
      pattern: '(?s)apply_patch\s*\(\s*"totals\.go".*(i\s*<\s*len\s*\(\s*s\s*\)|i\s*<=\s*len\s*\(\s*s\s*\)\s*-\s*1)'
