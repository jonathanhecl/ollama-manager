id: code-trace-py
name: 'Coding 02 · Trace (Python)'
description: 'Predict the printed value of an accumulator loop.'
group_id: coding
active: true
order: 4

system_prompt: |
  You are a precise coding assistant. Read code carefully and answer exactly what is asked.

options:
  temperature: 0.2

cases:
  - name: Trace accumulator
    prompt: |
      What does this Python print? Reply with ONLY the number:

      x = 0
      for i in range(1, 5):
          x += i * 2
      print(x)
    evaluation:
      type: exact_match
      expected: "20"
