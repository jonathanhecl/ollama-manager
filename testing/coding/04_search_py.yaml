id: code-search-py
name: 'Coding 04 · Search (Python)'
description: 'Locate a function definition with a fake search tool, then answer from the results.'
group_id: coding
active: true
order: 10

system_prompt: |
  You are an agent with access to these tools. To call a tool, reply with ONLY the tool call on one line, no other text:
  read_file("path") | list_dir("path") | search_code("word") — search all files for a word.
  After each call you receive a simulated result starting with [tool-result ok] or [tool-result ERROR].
  Never invent results. When the task is fully done, reply with: FINAL: <answer>

options:
  temperature: 0.2

cases:
  - name: Find where connect_db is defined
    prompt: |
      Repo files: main.py, db.py, api.py.
      In which file is the function `connect_db` defined?
      First locate it: reply with ONLY the tool call search_code("connect_db").
    evaluation:
      type: regex
      pattern: '(?i)search_code\s*\(\s*"connect_db"\s*\)'
    steps:
      - name: Answer from search hits
        prompt: |
          [tool-result ok] search_code("connect_db") ->
          main.py:8: # TODO call connect_db here
          db.py:3: def connect_db(url):
          api.py:21: connect_db(DATABASE_URL)
        evaluation:
          type: regex
          pattern: '(?i)FINAL:.*db\.py'
