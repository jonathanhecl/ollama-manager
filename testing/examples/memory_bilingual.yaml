id: example-memory
name: Bilingual Memory Chain
description: Multi-step memory across languages. A fact stated in English is recalled in Spanish.
group_id: examples
active: true
order: 7
system_prompt: Be concise.
steps:
  - step: 1
    name: Set fact EN
    prompt: My sister Clara is a marine biologist who studies octopuses. Remember this.
    evaluation:
      type: contains
      expected: Clara

  - step: 2
    name: Recall ES
    prompt: ¿A qué se dedica mi hermana? Responde en una frase corta.
    evaluation:
      type: contains
      expected: biol
