id: example-vision-cases
name: Vision per Case (sidecars)
description: Each case carries its own file. vision_cases-1.png and vision_cases-2.png
  are images, vision_cases-3.txt is inlined as text. Files live next to this
  YAML named <base>-<N>.<ext> (N = case number). Requires a vision-capable model.
group_id: examples
active: true
order: 9
required_caps:
  - vision
cases:
  - name: Red circle
    prompt: What color is the circle in the image? Reply with only the color name in English.
    evaluation:
      type: contains
      expected: red

  - name: Blue square
    prompt: What shape is the blue figure in the image? Reply with only the shape name in English.
    evaluation:
      type: contains
      expected: square

  - name: Attached note
    prompt: According to the attached note, what is the capital mentioned? Reply with only the city name.
    evaluation:
      type: contains
      expected: Lisboa
