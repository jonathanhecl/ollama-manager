id: rsn-dialogue-chain
name: 'Reasoning 05 · Sequential Context Retention'
description: Multi-step interactive chain testing sequential context retention across dialogue turns.
group_id: reasoning
active: true
order: 4

system_prompt: |
  You are a helpful and concise programming assistant.

steps:
  - step: 1
    name: Initial context inquiry
    prompt: I am learning Python for data analysis and machine learning. What is the primary library used for dataframes?
    evaluation:
      type: contains
      expected: pandas

  - step: 2
    name: Contextual follow-up
    prompt: What programming language did I mention I was learning in my previous message? Reply with just the language name.
    evaluation:
      type: contains
      expected: Python
