id: sim-malformed-call
name: 'SimAgent 04: Fix Malformed Call'
description: After a validation error the model must correct the tool call arguments.
group_id: simulated-agent
active: true
order: 3

system_prompt: |
  You are an agent with access to these tools. To call a tool, reply with ONLY the tool call on one line, no other text:
  read_file("path") | write_file("path", "content") | list_dir("path") | exec("command")
  After each call you receive a simulated result starting with [tool-result ok] or [tool-result ERROR].
  Never invent results. When the task is fully done, reply with: FINAL: <answer>

options:
  temperature: 0.2

cases:
  - name: Correct missing path after error
    prompt: |
      You tried read_file() and got this error:
      [tool-result ERROR] missing required param "path".
      Read notes.txt now.
    evaluation:
      type: regex
      pattern: '(?i)read_file\s*\(\s*"notes\.txt"\s*\)'

  - name: Correct missing content after error
    prompt: Save a shopping list to groceries.txt.
    evaluation:
      type: regex
      pattern: '(?i)write_file\s*\(\s*"groceries\.txt"'
    steps:
      - name: Retry with content included
        prompt: '[tool-result ERROR] write_file("groceries.txt") - missing required param "content". Retry with the full call.'
        evaluation:
          type: regex
          pattern: '(?i)write_file\s*\(\s*"groceries\.txt".+\)'
