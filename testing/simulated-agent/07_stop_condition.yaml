id: sim-stop-condition
name: 'SimAgent 07: Stop After Success'
description: After a successful result the model must answer FINAL instead of looping with more tool calls.
group_id: simulated-agent
active: true
order: 6

system_prompt: |
  You are an agent with access to these tools. To call a tool, reply with ONLY the tool call on one line, no other text:
  read_file("path") | write_file("path", "content") | list_dir("path") | exec("command")
  After each call you receive a simulated result starting with [tool-result ok] or [tool-result ERROR].
  Never invent results. When the task is fully done, reply with: FINAL: <answer>

options:
  temperature: 0.2

cases:
  - name: No extra calls after success
    prompt: What is inside status.txt? Read it and reply FINAL with the content.
    evaluation:
      type: regex
      pattern: '(?i)read_file\s*\(\s*"status\.txt"\s*\)'
    steps:
      - name: Final answer, no more tools
        prompt: '[tool-result ok] read_file("status.txt") -> "all systems nominal"'
        evaluation:
          type: human_review
