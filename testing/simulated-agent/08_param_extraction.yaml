id: sim-param-extraction
name: 'SimAgent 08: Extract Call Parameters'
description: Natural language requests must become tool calls with the right arguments.
group_id: simulated-agent
active: true
order: 7

system_prompt: |
  You are an agent with access to these tools. To call a tool, reply with ONLY the tool call on one line, no other text:
  read_file("path") | write_file("path", "content") | list_dir("path") | exec("command")
  After each call you receive a simulated result starting with [tool-result ok] or [tool-result ERROR].
  Never invent results. When the task is fully done, reply with: FINAL: <answer>

options:
  temperature: 0.2

cases:
  - name: Directory from request
    prompt: Show me what files are inside the "data" directory.
    evaluation:
      type: regex
      pattern: '(?i)list_dir\s*\(\s*"data"\s*\)'

  - name: Path and content from request
    prompt: 'Write "reminder: call Ana" into todo.txt'
    evaluation:
      type: regex
      pattern: '(?i)write_file\s*\(\s*"todo\.txt".*call Ana'

  - name: Command with flag from request
    prompt: Run the full backup using backup.sh with the --full flag.
    evaluation:
      type: regex
      pattern: '(?i)exec\s*\(.*backup\.sh.*--full'
