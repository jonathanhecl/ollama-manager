id: vis-ocr-document
name: 'Vision 03 · OCR Document'
description: 'Transcribes text from an invoice document photo.'
group_id: vision
active: true
order: 2
required_caps:
  - vision

cases:
  - name: 'Invoice'
    steps:
      - name: 'Transcribe document'
        prompt: Transcribe all text visible in this document image. Do not add anything else.
        attachment: 03_ocr_document-1.jpg
        options:
          temperature: 0.2
        evaluation:
          type: contains
          expected: "INV-4092"
