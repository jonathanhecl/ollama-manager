id: vis-describe-scene
name: 'Vision 05 · Describe Scene'
description: 'Describes a scene of a golden retriever dog with a frisbee in a park.'
group_id: vision
active: true
order: 4
required_caps:
  - vision

cases:
  - name: 'Park scene'
    steps:
      - name: 'Describe dog'
        prompt: Describe this image in two or three sentences. Mention only what is actually visible.
        attachment: 05_describe_scene-1.jpg
        options:
          temperature: 0.2
        evaluation:
          type: regex
          pattern: '(?i)\b(dog|golden retriever)\b'
